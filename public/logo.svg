<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tienda Barrio</title>
  <desc id="desc">Logo de una tienda de barrio con estilo oscuro y acento verde lima.</desc>
  <defs>
